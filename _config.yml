# GitHub Pages 설정. 저장소 루트를 사이트로 쓴다: README.md가 첫 화면, docs/*.md가 모드 문서다.
# 화면은 _layouts/default.html이 GitHub README와 같은 모양으로 그린다.
title: claude-code-mods
description: Claude Code 입력창 주변에 기능을 추가하는 모드 모음
lang: ko
exclude:
  - mods
  - demo
  - .claude-plugin
defaults:
  - scope:
      path: ""
    values:
      layout: default
