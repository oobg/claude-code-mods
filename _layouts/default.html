<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != '/' and page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" type="image/png" href="{{ '/docs/images/favicon.png' | relative_url }}">
  <!-- GitHub README와 같은 모양. 시스템 다크/라이트 설정을 따른다. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <style>
    body { margin: 0; background: #ffffff; }
    @media (prefers-color-scheme: dark) { body { background: #0d1117; } }
    .markdown-body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }
    @media (max-width: 767px) { .markdown-body { padding: 16px; } }
  </style>
</head>
<body>
  <article class="markdown-body">
{{ content }}
  </article>
  <script>
    // README와 문서는 GitHub에서도 읽히도록 .md로 서로를 가리킨다. 사이트에서는 같은 이름의 .html로 바꾼다.
    document.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (/^(\.|\/|[\w-]+\/)[^:]*\.md(#.*)?$/.test(href) || /^[\w-]+\.md(#.*)?$/.test(href)) {
        a.setAttribute('href', href.replace(/README\.md/, 'index.html').replace(/\.md(#|$)/, '.html$1'));
      }
    });
  </script>
</body>
</html>
